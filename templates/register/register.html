{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - GeneRX</title>
    <link rel="stylesheet" href="{% static 'css/register/register.css' %}">
</head>
<body>
    <!-- Decorative background elements (purely visual) -->
    <div class="bg-circle c1">🧬</div>
    <div class="bg-circle c2">💗</div>
    <div class="bg-circle c3">🩺</div>

    <div class="container">
        <div class="logo-icon">✚</div>
        <h1>Create Account!</h1>

        {% if errors %}
            {% for error in errors %}
                <p class="error-msg">{{ error }}</p>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" value="{{ username }}" required>
                <span class="field-icon"></span>
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" value="{{ email }}" required>
                <span class="field-icon"></span>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create a password" required>
                <span class="field-icon"></span>
            </div>
            <div class="field">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Type the password again" required>
                <span class="field-icon"></span>
            </div>
            <button type="submit">SIGN UP</button>
        </form>

        <div class="link-row">
            Already have an account? <a href="{% url 'login:login' %}">Sign In</a>
        </div>
    </div>
    <script src="{% static 'js/register/register.js' %}"></script>
</body>
</html>
