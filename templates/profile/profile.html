{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - GeneRX</title>
    <!-- ?v=2 forces your browser to bypass cached old styles -->
    <link rel="stylesheet" href="{% static 'css/profile/profile.css' %}?v=2">
</head>
<body>
    <div class="container">
        <!-- Top App Bar (Identical to Home & Settings) -->
        <div class="genrx-top">
            <a href="{% url 'home:home' %}" class="menu-btn" title="Back to Home">←</a>
            <div class="nav-links">
                <a href="{% url 'home:home' %}">Home</a>
                <a href="{% url 'user_settings:settings' %}">Settings</a>
                <a href="{% url 'login:logout' %}">Logout</a>
                <div class="avatar">{{ request.user.username|slice:":1"|upper }}</div>
            </div>
        </div>

        <!-- Greeting / Title Block -->
        <div class="greeting-block">
            <h1>My Profile</h1>
            <p class="greeting-sub">ACCOUNT & PERSONAL INFO</p>
        </div>

        <!-- Profile Hero Card (Preview Banner) -->
        <div class="profile-hero-card">
            <div class="hero-avatar">{{ request.user.username|slice:":1"|upper }}</div>
            <div class="hero-details">
                <span class="hero-username">@{{ request.user.username }}</span>
                <span class="hero-badge">GeneRX Member</span>
            </div>
        </div>

        <form method="post">
            {% csrf_token %}

            <!-- Inner Form Card -->
            <div class="inner-card">
                <div class="card-header">
                    <div class="card-icon-circle">👤</div>
                    <div class="card-title">Personal Details</div>
                </div>

                <div class="field-group">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" value="{{ profile.full_name|default:'' }}" placeholder="e.g. Jane Doe">
                </div>

                <div class="field-group">
                    <label for="bio">Bio & Health Notes</label>
                    <textarea id="bio" name="bio" rows="4" placeholder="Add a short bio, known allergies, or prescription notes...">{{ profile.bio|default:'' }}</textarea>
                </div>
            </div>

            <!-- Main Submit Button -->
            <button type="submit" class="action-btn-main">Save Profile</button>
        </form>
    </div>

    <script src="{% static 'js/profile/profile.js' %}"></script>
</body>
</html>
